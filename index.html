<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞技游戏趋势 · 视觉 v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap');

:root {
  --bg: #13161e;
  --bg2: #191d2a;
  --bg3: #1f2435;
  --card: #1a1e2d;
  --border: rgba(255,255,255,.05);
  --border-hv: rgba(255,107,53,.15);
  --text: #d1d5e0;
  --text2: #9ca0b8;
  --text3: #656a85;
  --acc-orange: #f97316;
  --acc-red: #ef4444;
  --acc-cyan: #14b8a6;
  --acc-green: #22c55e;
  --acc-purple: #a78bfa;
  --accent: #f97316;
  --red: #ef4444;
  --grd-orange: linear-gradient(135deg,#f97316,#ef4444);
  --grd-cyan: linear-gradient(135deg,#14b8a6,#a78bfa);
  --grd-red: linear-gradient(135deg,#ef4444,#f97316);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Plus Jakarta Sans','PingFang SC','Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
}

.app{max-width:1120px;margin:0 auto;padding:20px 24px 48px}

/* HEADER */
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.header h1{
  font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;
  background:var(--grd-orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.2px;
}
.tabs{display:flex;background:var(--bg2);border-radius:8px;padding:2px;border:1px solid var(--border)}
.tab{
  padding:6px 18px;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--text3);transition:all .15s;user-select:none;letter-spacing:.2px;
}
.tab.active{background:var(--grd-orange);color:#fff}
.tab:hover:not(.active){color:var(--text2)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sub-text{font-size:11px;color:var(--text3)}
.sub-text strong{color:var(--text2);font-weight:600}
.sub-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;
  background:var(--bg2);color:var(--text2);border:1px solid var(--border);
  cursor:pointer;transition:all .12s;
}
.sub-btn:hover{background:var(--bg3);color:var(--text)}

/* STATS */
.stats{display:flex;gap:8px;margin-bottom:20px}
.stat{
  flex:1;background:var(--card);border-radius:10px;padding:12px 16px;
  border:1px solid var(--border);
}
.stat .n{font-size:18px;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--text)}
.stat .n.o{color:var(--acc-orange)}
.stat .n.c{color:var(--acc-cyan)}
.stat .n.r{color:var(--acc-red)}
.stat .l{font-size:10px;color:var(--text3);margin-top:1px;letter-spacing:.3px}

/* FILTERS */
.filters{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.f-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;
  background:var(--card);color:var(--text3);border:1px solid var(--border);
  cursor:pointer;transition:all .12s;user-select:none;
}
.f-btn.active{background:rgba(249,115,22,.1);color:var(--acc-orange);border-color:rgba(249,115,22,.2)}
.f-btn:hover:not(.active){background:var(--bg3);color:var(--text2)}
.fd{width:1px;height:18px;background:var(--border);margin:0 3px}

/* SECTION */
.section{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section .badge{padding:2px 10px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px}
.section .badge.t{background:rgba(249,115,22,.1);color:var(--acc-orange)}
.section .badge.h{background:rgba(239,68,68,.1);color:var(--acc-red)}
.section h3{font-size:13px;font-weight:700}
.section .cnt{font-size:11px;color:var(--text3);margin-left:auto}
.section .cnt span{color:var(--text2);font-weight:700}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}

/* TREND CARD */
.tc{
  background:var(--card);border-radius:12px;padding:14px 16px 12px;
  cursor:pointer;border:1px solid var(--border);
  transition:all .15s;position:relative;overflow:hidden;
}
.tc:hover{border-color:var(--border-hv);transform:translateY(-1px)}
.tc::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;
  background:linear-gradient(180deg,var(--acc-orange),var(--acc-purple));border-radius:2px}
.tc .top{display:flex;justify-content:space-between}
.tc .tl{font-size:13px;font-weight:700;line-height:1.35;max-width:68%;letter-spacing:-.1px;color:var(--text)}
.tc .sc{font-size:22px;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--acc-orange);line-height:1}
.tc .slb{font-size:9px;color:var(--text3);text-align:right;letter-spacing:.5px}
.tc .bd{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tc .bt{margin-top:8px;display:flex;gap:4px}
.tg{padding:1px 8px;border-radius:4px;font-size:10px;font-weight:600}
.tg.ext{background:rgba(20,184,166,.08);color:var(--acc-cyan);border:1px solid rgba(20,184,166,.12)}
.tg.int{background:rgba(249,115,22,.08);color:var(--acc-orange);border:1px solid rgba(249,115,22,.12)}
.tg.dual{background:rgba(239,68,68,.08);color:var(--acc-red);border:1px solid rgba(239,68,68,.12)}
.gb{background:rgba(255,255,255,.03);padding:1px 8px;border-radius:4px;font-size:10px;font-weight:600;color:var(--text2)}
.gr{font-size:11px;font-weight:700;color:var(--acc-green)}
.tpb{background:rgba(167,139,250,.06);color:var(--acc-purple);padding:1px 8px;border-radius:4px;font-size:10px;font-weight:600}
.tmb{font-size:9px;color:var(--text3)}
.prb{padding:4px 12px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid rgba(249,115,22,.18);background:rgba(249,115,22,.08);color:var(--acc-orange);transition:all .12s}
.prb:hover{background:rgba(249,115,22,.15)}

/* HOT CARD */
.hc{
  background:var(--card);border-radius:12px;padding:12px 16px 12px;
  cursor:pointer;border:1px solid var(--border);
  transition:all .15s;
}
.hc:hover{border-color:rgba(239,68,68,.15);transform:translateY(-1px)}
.hbr{height:2.5px;background:rgba(255,255,255,.03);border-radius:2px;margin-bottom:10px;overflow:hidden}
.hfl{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc-red),var(--acc-orange));transition:width .3s}
.hc .top{display:flex;justify-content:space-between}
.hc .tl{font-size:13px;font-weight:700;line-height:1.35;max-width:62%;letter-spacing:-.1px;color:var(--text)}
.hc .sc{font-size:22px;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--acc-red);line-height:1}
.hc .slb{font-size:9px;color:var(--text3);text-align:right;letter-spacing:.5px}
.hc .bd{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tg.comm{background:rgba(249,115,22,.08);color:#fb923c;border:1px solid rgba(249,115,22,.12)}
.tg.glbl{background:rgba(239,68,68,.08);color:var(--acc-red);border:1px solid rgba(239,68,68,.12)}
.hs{font-size:10px;color:var(--text3)}
.hs strong{color:var(--text2);font-weight:700}
.lf{font-size:10px;font-weight:600;padding:1px 8px;border-radius:4px}
.lf.up{background:rgba(34,197,94,.08);color:var(--acc-green);border:1px solid rgba(34,197,94,.12)}
.lf.peak{background:rgba(239,68,68,.08);color:var(--acc-red);border:1px solid rgba(239,68,68,.12)}
.lf.dec{background:rgba(255,255,255,.03);color:var(--text3);border:1px solid var(--border)}
.hc .bt{margin-top:8px;display:flex;gap:4px}

/* EMPTY */
.emp{grid-column:1/-1;padding:40px;text-align:center;color:var(--text3);font-size:12px}
.emp .ic{font-size:28px;margin-bottom:8px;opacity:.4}

/* DRAWER */
.dr{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:90vw;
  background:var(--bg2);z-index:1000;transform:translateX(100%);
  transition:transform .25s;overflow-y:auto;border-left:1px solid var(--border)}
.dr.open{transform:translateX(0)}
.ol{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:999;opacity:0;pointer-events:none;transition:opacity .15s}
.ol.show{opacity:1;pointer-events:auto}
.dh{display:flex;padding:18px 20px;border-bottom:1px solid var(--border);align-items:flex-start}
.di{flex:1;min-width:0}
.dt{font-size:15px;font-weight:700;line-height:1.4;color:var(--text)}
.dm{font-size:11px;color:var(--text3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.dsc{font-size:26px;font-weight:800;font-family:'Space Grotesk',sans-serif;margin-right:6px}
.dsc.o{color:var(--acc-orange)}
.dsc.r{color:var(--acc-red)}
.dsl{font-size:9px;color:var(--text3);text-align:right}
.dcl{width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.dcl:hover{background:var(--card);color:var(--text)}
.dsec{padding:16px 20px;border-bottom:1px solid var(--border)}
.dsec:last-child{border:none}
.dsec h4{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:10px;letter-spacing:.8px}
.drow{display:flex;gap:16px}
.di2{flex:1}
.di2 .v{font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text)}
.di2 .l{font-size:10px;color:var(--text3);margin-top:2px}
.nl{display:flex;flex-direction:column;gap:6px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .12s}
.ni:hover{background:var(--bg3);border-color:rgba(249,115,22,.12)}
.ni .ic{width:26px;height:26px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ni .info{flex:1;min-width:0}
.ni .info .t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ni .info .s{font-size:10px;color:var(--text3);margin-top:1px}
.ni .lk{font-size:10px;color:var(--acc-cyan);font-weight:600}
.ac{background:var(--card);border-radius:8px;padding:14px;border:1px solid var(--border);font-size:12px;line-height:1.6;color:var(--text2)}
.ac .l{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:6px;letter-spacing:.5px}
.ac .rw{display:flex;gap:10px;margin-top:8px}
.at{padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* MODAL */
.md{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center}
.md.show{display:flex}
.mb{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.mc{position:relative;background:var(--bg2);border-radius:14px;width:400px;max-width:90vw;padding:20px;border:1px solid var(--border)}
.mc h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
.ms{width:100%;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:11px;color:var(--text);outline:none;margin-bottom:10px}
.ms:focus{border-color:rgba(249,115,22,.2)}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-height:220px;overflow-y:auto}
.gi{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--text2)}
.gi:hover{background:var(--bg3);color:var(--text)}
.gi input{accent-color:var(--acc-orange);width:13px;height:13px;cursor:pointer}
.mf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.mf .cn{font-size:10px;color:var(--text3)}
.mf .cn strong{color:var(--text2)}
.ma{display:flex;gap:4px}
.mb2{padding:5px 14px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:none}
.mb2.pr{background:var(--grd-orange);color:#fff}
.mb2.pr:hover{opacity:.9}
.mb2.sc{background:var(--card);color:var(--text2);border:1px solid var(--border)}
.mb2.sc:hover{background:var(--bg3);color:var(--text)}
.tt{position:fixed;bottom:28px;left:50%;transform:translate(-50%,16px);background:var(--bg2);color:var(--text);padding:8px 20px;border-radius:8px;font-size:12px;font-weight:500;z-index:3000;border:1px solid var(--border);opacity:0;transition:all .2s;pointer-events:none}
.tt.show{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>◈ 竞技游戏趋势</h1>
    <div class="tabs" id="tabs">
      <div class="tab active" data-t="trend">🚀 实时趋势</div>
      <div class="tab" data-t="hot">🔥 热点</div>
    </div>
    <div class="header-right">
      <span class="sub-text">🎯 <strong id="sc">14</strong>/14</span>
      <button class="sub-btn" id="sbb">管理</button>
      <span class="sub-text" id="ut">—</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="st1">—</div><div class="l">趋势</div></div>
    <div class="stat"><div class="n c" id="st2">—</div><div class="l">蓝海选题</div></div>
    <div class="stat"><div class="n o" id="st3">—</div><div class="l">站内苗头</div></div>
    <div class="stat"><div class="n r" id="st4">—</div><div class="l">热点</div></div>
  </div>

  <div class="filters" id="fl">
    <div class="f-btn active" d-f="game-all">全部游戏</div>
    <div class="f-btn" d-f="game-王者荣耀">王者</div>
    <div class="f-btn" d-f="game-和平精英">和平</div>
    <div class="f-btn" d-f="game-三角洲行动">三角洲</div>
    <div class="f-btn" d-f="game-金铲铲之战">金铲铲</div>
    <div class="fd"></div>
    <div class="f-btn active" d-f="type-all">全部</div>
    <div class="f-btn" d-f="type-创作型">创作</div>
    <div class="f-btn" d-f="type-讨论型">讨论</div>
  </div>

  <div id="ts">
    <div class="section"><div class="badge t">实时趋势</div><span class="cnt" id="tc"></span></div>
    <div class="grid" id="tg"></div>
  </div>
  <div id="hs" style="display:none">
    <div class="section"><div class="badge h">热点</div><span class="cnt" id="hc"></span></div>
    <div class="grid" id="hg"></div>
  </div>
</div>

<div class="ol" id="ol"></div>
<div class="dr" id="dr">
  <div class="dh">
    <div class="di"><div class="dt" id="dt">—</div><div class="dm" id="dm"><span id="dg">—</span><span id="dso">—</span><span id="dty">—</span></div></div>
    <div style="text-align:right;margin-right:8px"><div class="dsc" id="ds">—</div><div class="dsl" id="dsl">势能</div></div>
    <button class="dcl" id="dcl">✕</button>
  </div>
  <div class="dsec"><h4>数据概览</h4><div class="drow"><div class="di2"><div class="v" id="dd1">—</div><div class="l" id="dd1l">—</div></div><div class="di2"><div class="v" id="dd2">—</div><div class="l" id="dd2l">—</div></div><div class="di2"><div class="v" id="dd3">—</div><div class="l" id="dd3l">—</div></div></div></div>
  <div class="dsec"><h4>样本笔记</h4><div class="nl" id="dn"></div></div>
  <div class="dsec"><h4>AI 建议</h4><div class="ac"><div class="l">切入方向</div><div id="dai">—</div><div class="rw"><span class="at" id="ddf">—</span><span class="at" id="dac">—</span></div></div></div>
</div>

<div class="md" id="md">
  <div class="mb" id="mbb"></div>
  <div class="mc">
    <h3>管理关注游戏</h3>
    <input class="ms" id="msr" placeholder="搜索…">
    <div class="gl" id="gl"></div>
    <div class="mf"><span class="cn">已关注 <strong id="mcn">14</strong>/14</span><div class="ma"><button class="mb2 sc" id="mal">全选</button><button class="mb2 sc" id="mcl">清除</button><button class="mb2 pr" id="msv">保存</button></div></div>
  </div>
</div>
<div class="tt" id="tt"></div>

<script>
const G='王者荣耀,和平精英,三角洲行动,金铲铲之战,英雄联盟,无畏契约,火影忍者,PUBG,暗区突围,永劫无间,CSGO,穿越火线：枪战王者,DOTA2,王者万象棋'.split(',')
const TY=['创作型','讨论型','双重']
const ST=['站外热','站内苗头','双重信号']
const SH=['全网热点','社区热点']
const LI=['上升期','高峰期','衰退期']
const rr=a=>a[Math.random()*a.length|0]
const ri=(a,b)=>Math.random()*(b-a+1)|0+a

const TR=Array.from({length:12},(_,i)=>({
  id:'t'+i,
  tl:['一句台词玩梗挑战','角色cos初音未来','打野梯度排行','游戏BGM卡点','新赛季调整','操作集锦','游戏CG混剪','队友神操作','彩蛋发现','版本预测','翻盘教学','台词模仿'][i],
  gm:rr(G),mo:ri(62,95),gr:ri(80,450),n6:ri(60,280),ty:rr(TY),so:rr(ST),ha:ri(1,8),
  ai:'创作方向：用角色BGM配台词做二创，建议短视频。',di:'中',ac:'短视频'
}))

const HO=Array.from({length:8},(_,i)=>({
  id:'h'+i,
  tl:['角色cos日常穿搭','和平精英变装','金铲铲攻略合集','英雄联盟观赛','无畏契约技巧','王者赛季回顾','角色仿妆','应援创作'][i],
  gm:rr(G),hs:ri(63,93),nt:ri(2000,8500),ce:ri(25,88),l24:ri(300,1200),
  lc:rr(LI),ty:rr(TY),so:rr(SH),ha:ri(4,36),
  ai:'持续增长，建议加大通告。',di:'中',ac:'通告'
}))

let tb='trend',fg='all',ft='all',sb=G.slice()
try{const s=localStorage.getItem('sg');if(s)sb=JSON.parse(s)}catch(e){}

function rd(){
  const ti=TR.filter(t=>(fg=='all'||t.gm==fg)&&(ft=='all'||t.ty==ft)&&sb.includes(t.gm))
  const hi=HO.filter(t=>(fg=='all'||t.gm==fg)&&(ft=='all'||t.ty==ft)&&sb.includes(t.gm))
  document.getElementById('tc').innerHTML='<span>'+ti.length+'</span> 条'
  document.getElementById('hc').innerHTML='<span>'+hi.length+'</span> 条'
  document.getElementById('st1').textContent=ti.length
  document.getElementById('st2').textContent=ti.filter(t=>t.so=='站外热'||t.so=='双重信号').length
  document.getElementById('st3').textContent=ti.filter(t=>t.so=='站内苗头').length
  document.getElementById('st4').textContent=hi.length
  document.getElementById('sc').textContent=sb.length
  const g=document.getElementById('tg'),h=document.getElementById('hg')
  g.innerHTML=ti.length?ti.map(t=>'<div class=tc data-i='+t.id+'><div class=top><div class=tl>'+t.tl+'</div><div><div class=sc>'+t.mo+'</div><div class=slb>势能</div></div></div><div class=bd>'+'<span class="tg ext">'+t.so+'</span><span class=gb>'+t.gm+'</span><span class=gr>↑'+t.gr+'%</span><span class=tpb>'+t.ty+'</span><span class=tmb>⏱'+t.ha+'h前</span></div><div class=bt><button class=prb>查看详情</button></div></div>').join(''):'<div class=emp><div class=ic>📡</div>暂无趋势 · 6h后刷新</div>'
  h.innerHTML=hi.length?hi.map(t=>'<div class=hc data-i='+t.id+'><div class=hbr><div class=hfl style=width:'+t.hs+'%></div></div><div class=top><div class=tl>'+t.tl+'</div><div><div class=sc>'+t.hs+'</div><div class=slb>热度</div></div></div><div class=bd>'+'<span class="tg '+(t.so=='全网热点'?'glbl':'comm')+'">'+t.so+'</span><span class=gb>'+t.gm+'</span><span class=hs>发布 <strong>'+(t.nt/1000).toFixed(1)+'k</strong></span><span class=hs>CES <strong>'+t.ce+'w</strong></span><span class="lf '+(t.lc=='上升期'?'up':t.lc=='高峰期'?'peak':'dec')+'">'+(t.lc=='上升期'?'📈':t.lc=='高峰期'?'🔝':'📉')+t.lc+'</span><span class=tmb>⏱'+t.ha+'h前</span></div><div class=bt><button class=prb>详情</button></div></div>').join(''):'<div class=emp><div class=ic>🔥</div>暂无热点 · 6h后刷新</div>'
  document.querySelectorAll('.prb').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation()
    const c=e.target.closest('[data-i]');if(!c)return
    const id=c.dataset.i,pool=c.closest('.tc')?TR:HO
    const item=pool.find(x=>x.id==id)
    if(item){const is=!!c.closest('.tc')
      document.getElementById('dt').textContent=item.tl
      document.getElementById('dg').textContent=item.gm
      document.getElementById('dso').textContent=item.so
      document.getElementById('dty').textContent=item.ty
      const se=document.getElementById('ds');se.className='dsc '+(is?'o':'r')
      se.textContent=is?item.mo:item.hs
      document.getElementById('dsl').textContent=is?'势能':'热度'
      document.getElementById('dd1l').textContent=is?'增速':'累计发布'
      document.getElementById('dd1').textContent=is?'↑'+item.gr+'%':(item.nt/1000).toFixed(1)+'k'
      document.getElementById('dd2l').textContent=is?'近6h笔记':'CES'
      document.getElementById('dd2').textContent=is?item.n6:item.ce+'w'
      document.getElementById('dd3l').textContent='出现'
      document.getElementById('dd3').textContent=item.ha+'h前'
      document.getElementById('dn').innerHTML=[{t:item.tl+' · 小红书',s:'❤️ 12k · 站内',i:'📱'},{t:item.tl+' · 抖音',s:'❤️ 8k · 站外',i:'🎬'},{t:item.tl+' · B站',s:'❤️ 5k · 站外',i:'▶️'}].map(n=>'<div class=ni onclick="alert(\'打开笔记\')"><div class=ic>'+n.i+'</div><div class=info><div class=t>'+n.t+'</div><div class=s>'+n.s+'</div></div><span class=lk>打开→</span></div>').join('')
      document.getElementById('dai').textContent=item.ai
      document.getElementById('ddf').textContent='复刻 · '+item.di
      document.getElementById('dac').textContent='承接 · '+item.ac
      document.getElementById('dr').classList.add('open')
      document.getElementById('ol').classList.add('show')
    }
  }))
}
rd()
document.getElementById('dcl').addEventListener('click',()=>{document.getElementById('dr').classList.remove('open');document.getElementById('ol').classList.remove('show')})
document.getElementById('ol').addEventListener('click',()=>{document.getElementById('dr').classList.remove('open');document.getElementById('ol').classList.remove('show')})
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');tb=this.dataset.t;document.getElementById('ts').style.display=tb=='trend'?'':'none';document.getElementById('hs').style.display=tb=='hot'?'':'none'}))
document.querySelectorAll('.f-btn').forEach(b=>b.addEventListener('click',function(){const f=this.getAttribute('d-f');if(f.startsWith('game-')){document.querySelectorAll('[d-f^="game-"]').forEach(b=>b.classList.remove('active'));this.classList.add('active');fg=f.slice(5)}else{document.querySelectorAll('[d-f^="type-"]').forEach(b=>b.classList.remove('active'));this.classList.add('active');ft=f.slice(5)}rd()}))
document.getElementById('sbb').addEventListener('click',os);document.getElementById('mbb').addEventListener('click',()=>document.getElementById('md').classList.remove('show'))
document.getElementById('msr').addEventListener('input',os);document.getElementById('mal').addEventListener('click',()=>{document.querySelectorAll('#gl input').forEach(c=>c.checked=true);uc()})
document.getElementById('mcl').addEventListener('click',()=>{document.querySelectorAll('#gl input').forEach(c=>c.checked=false);uc()})
document.getElementById('msv').addEventListener('click',()=>{sb=[...document.querySelectorAll('#gl input:checked')].map(c=>c.value);localStorage.setItem('sg',JSON.stringify(sb));document.getElementById('md').classList.remove('show');rd();tt('已保存')})
function os(){const q=document.getElementById('msr').value.toLowerCase()
  document.getElementById('gl').innerHTML=G.filter(g=>g.toLowerCase().includes(q)).map(g=>'<label class=gi><input type=checkbox value="'+g+'" '+(sb.includes(g)?'checked':'')+'>'+g+'</label>').join('')
  uc();document.getElementById('md').classList.add('show')
}
function uc(){document.getElementById('mcn').textContent=document.querySelectorAll('#gl input:checked').length}
function tt(m){const t=document.getElementById('tt');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
const n=new Date();document.getElementById('ut').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')
</script>
