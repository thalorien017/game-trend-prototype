<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞技游戏趋势看板 · 低保真原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI','Helvetica Neue',sans-serif;
  background:#f5f5f7;color:#1d1d1f;
  min-height:100vh;
}
.app{max-width:1080px;margin:0 auto;padding:28px 24px}

/* HEADER */
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.header h1{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.tabs{display:flex;background:#fff;border-radius:30px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tab{padding:7px 20px;border-radius:24px;font-size:13px;font-weight:500;cursor:pointer;color:#86868b;transition:all .15s;user-select:none}
.tab.active{background:#1d1d1f;color:#fff}
.tab:hover:not(.active){background:#eee}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sub-text{font-size:12px;color:#86868b}
.sub-text strong{color:#1d1d1f;font-weight:600}
.sub-btn{padding:4px 12px;border-radius:30px;font-size:12px;background:#fff;color:#1d1d1f;border:1px solid #e5e5ea;cursor:pointer;transition:all .15s}
.sub-btn:hover{background:#f5f5f7}

/* STATS */
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{background:#fff;border-radius:14px;padding:12px 18px;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat .n{font-size:18px;font-weight:700}
.stat .l{font-size:11px;color:#86868b;margin-top:1px}
.stat .n.blue{color:#007aff}
.stat .n.orange{color:#ff9500}
.stat .n.pink{color:#ff375f}

/* FILTERS */
.filters{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.f-btn{padding:5px 12px;border-radius:30px;font-size:12px;font-weight:500;background:#fff;color:#86868b;border:1px solid #e5e5ea;cursor:pointer;transition:all .12s;user-select:none}
.f-btn.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.f-btn:hover:not(.active){background:#f0f0f5}

/* SECTION */
.section{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.section .bar{width:3px;height:14px;border-radius:2px}
.section .bar.o{background:#ff9500}
.section .bar.r{background:#ff375f}
.section h3{font-size:14px;font-weight:600;color:#1d1d1f}
.section .help{font-size:11px;color:#86868b;margin-left:auto}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}

/* TREND CARD */
.t-card{background:#fff;border-radius:16px;padding:16px;cursor:pointer;border:1px solid transparent;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.t-card:hover{border-color:#d1d1d6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.t-card .t{display:flex;justify-content:space-between;align-items:flex-start}
.t-card .title{font-size:14px;font-weight:600;line-height:1.35;max-width:65%}
.t-card .score{font-size:22px;font-weight:700;color:#ff9500;margin-top:-3px}
.t-card .slabel{font-size:10px;color:#86868b;text-align:right}
.t-card .body{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{padding:2px 10px;border-radius:30px;font-size:11px;font-weight:500}
.tag.ext{background:#e8f5f1;color:#00a884}
.tag.int{background:#fff0e0;color:#c96200}
.tag.dual{background:#ffe5ea;color:#d1344f}
.tag.comm{background:#ffebf0;color:#c7003d}
.tag.glbl{background:#f0f0f5;color:#515154}
.game{background:#f5f5f7;padding:2px 10px;border-radius:30px;font-size:11px;font-weight:500;color:#515154}
.grow{font-size:12px;font-weight:600;color:#34c759}
.type{background:#f5f5f7;color:#515154;padding:2px 10px;border-radius:30px;font-size:11px}
.t-card .bot{margin-top:10px;display:flex;gap:6px}
.b-btn{padding:5px 14px;border-radius:30px;font-size:11px;font-weight:500;cursor:pointer;border:none;transition:all .12s}
.b-btn.pri{background:#1d1d1f;color:#fff}
.b-btn.pri:hover{background:#333}
.b-btn.sec{background:#f5f5f7;color:#515154}
.b-btn.sec:hover{background:#e8e8ed}

/* HOT CARD */
.h-card{background:#fff;border-radius:16px;padding:16px;cursor:pointer;border:1px solid transparent;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.h-card:hover{border-color:#d1d1d6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.h-bar{height:3px;background:#f0f0f5;border-radius:2px;margin-bottom:10px;overflow:hidden}
.h-fill{height:100%;border-radius:2px;background:#ff375f;transition:width .3s}
.h-card .t{display:flex;justify-content:space-between;align-items:flex-start}
.h-card .title{font-size:14px;font-weight:600;line-height:1.35;max-width:60%}
.h-card .score{font-size:22px;font-weight:700;color:#ff375f;margin-top:-3px}
.h-card .sl{font-size:10px;color:#86868b;text-align:right}
.h-body{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.h-stat{font-size:12px;color:#515154}
.h-stat strong{font-weight:600;color:#1d1d1f}
.life{font-size:11px;font-weight:500;padding:1px 10px;border-radius:30px}
.life.up{background:#e8f5e8;color:#34c759}
.life.peak{background:#ffe5e5;color:#ff3b30}
.life.decline{background:#f0f0f5;color:#86868b}

/* DETAIL DRAWER */
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:90vw;background:#fff;z-index:1000;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,.61,.36,1);overflow-y:auto;box-shadow:-2px 0 24px rgba(0,0,0,.08)}
.drawer.open{transform:translateX(0)}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.2);z-index:999;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.d-header{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 24px 16px;border-bottom:1px solid #f0f0f5}
.d-header .t{flex:1}
.d-header .title{font-size:16px;font-weight:700;line-height:1.4;padding-right:12px}
.d-header .meta{font-size:12px;color:#86868b;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.d-header .score{font-size:28px;font-weight:800;white-space:nowrap}
.d-header .score.orange{color:#ff9500}
.d-header .score.pink{color:#ff375f}
.d-close{width:32px;height:32px;border-radius:50%;background:#f5f5f7;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#86868b;transition:all .12s;flex-shrink:0}
.d-close:hover{background:#e8e8ed}
.d-section{padding:20px 24px;border-bottom:1px solid #f0f0f5}
.d-section:last-child{border-bottom:none}
.d-section h4{font-size:13px;font-weight:600;color:#86868b;margin-bottom:10px;letter-spacing:.3px}
.data-row{display:flex;gap:20px;margin-bottom:4px}
.data-item{flex:1}
.data-item .v{font-size:16px;font-weight:600;color:#1d1d1f}
.data-item .lbl{font-size:11px;color:#86868b;margin-top:1px}
.note-list{display:flex;flex-direction:column;gap:8px}
.note-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f5f5f7;border-radius:12px;cursor:pointer;transition:all .12s}
.note-item:hover{background:#e8e8ed}
.note-item .icon{width:32px;height:32px;border-radius:8px;background:#d1d1d6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.note-item .info{flex:1;min-width:0}
.note-item .info .t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .info .sub{font-size:10px;color:#86868b;margin-top:1px}
.note-item .link{font-size:10px;color:#007aff;font-weight:500}
.ai-card{background:#f5f5f7;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;color:#1d1d1f}
.ai-card .lbl{font-size:11px;font-weight:600;color:#86868b;margin-bottom:6px}
.ai-card .row{display:flex;gap:16px;margin-top:8px}
.ai-tag{padding:2px 10px;border-radius:30px;font-size:11px;font-weight:500;background:#fff;color:#515154;border:1px solid #e5e5ea}

/* GAME SUBSCRIPTION MODAL */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.modal-card{position:relative;background:#fff;border-radius:20px;width:420px;max-width:90vw;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.modal-card h3{font-size:16px;font-weight:700;margin-bottom:16px}
.modal-search{width:100%;padding:8px 14px;border-radius:12px;border:1px solid #e5e5ea;font-size:13px;margin-bottom:12px;outline:none}
.modal-search:focus{border-color:#1d1d1f}
.game-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:260px;overflow-y:auto;padding-right:4px}
.game-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;cursor:pointer;transition:all .12s;font-size:13px}
.game-item:hover{background:#f5f5f7}
.game-item input[type=checkbox]{accent-color:#1d1d1f;width:14px;height:14px;cursor:pointer}
.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f5}
.modal-footer .count{font-size:12px;color:#86868b}
.modal-footer .count strong{color:#1d1d1f}
.mod-actions{display:flex;gap:6px}
.mod-btn{padding:6px 16px;border-radius:30px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .12s}
.mod-btn.pri{background:#1d1d1f;color:#fff}
.mod-btn.pri:hover{background:#333}
.mod-btn.sec{background:#f5f5f7;color:#515154}
.mod-btn.sec:hover{background:#e8e8ed}

/* EMPTY STATE */
.empty{padding:48px 0;text-align:center;color:#86868b;font-size:13px;grid-column:1 / -1}
.empty .icon{font-size:36px;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:30px;font-size:13px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <h1>竞技游戏趋势</h1>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="trend">🚀 实时趋势</div>
      <div class="tab" data-tab="hot">🔥 热点</div>
    </div>
    <div class="header-right">
      <span class="sub-text">🎯 <strong id="subCount">14</strong>/14 款游戏</span>
      <button class="sub-btn" id="subBtn">管理</button>
      <span class="sub-text" id="updateTime">更新于 5 分钟前</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats" id="stats">
    <div class="stat"><div class="n" id="statTrendTotal">—</div><div class="l">实时趋势</div></div>
    <div class="stat"><div class="n blue" id="statBlue">—</div><div class="l">蓝海选题</div></div>
    <div class="stat"><div class="n orange" id="statInternal">—</div><div class="l">站内苗头</div></div>
    <div class="stat"><div class="n pink" id="statHot">—</div><div class="l">热点</div></div>
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filters">
    <div class="f-btn active" data-filter="game-all">全部游戏</div>
    <div class="f-btn" data-filter="game-王者荣耀">王者荣耀</div>
    <div class="f-btn" data-filter="game-和平精英">和平精英</div>
    <div class="f-btn" data-filter="game-三角洲行动">三角洲</div>
    <div class="f-btn" data-filter="game-金铲铲之战">金铲铲</div>
    <div class="f-btn active" data-filter="type-all">全部类型</div>
    <div class="f-btn" data-filter="type-创作型">创作型</div>
    <div class="f-btn" data-filter="type-讨论型">讨论型</div>
  </div>

  <!-- TREND SECTION -->
  <div id="trendSection">
    <div class="section"><div class="bar o"></div><h3>🚀 实时趋势</h3><span class="help" id="trendHelp"></span></div>
    <div class="grid" id="trendGrid"></div>
  </div>

  <!-- HOT SECTION -->
  <div id="hotSection" style="display:none">
    <div class="section"><div class="bar r"></div><h3>🔥 热点看板</h3><span class="help" id="hotHelp"></span></div>
    <div class="grid" id="hotGrid"></div>
  </div>

  <!-- FOOTER -->
  <div style="text-align:center;padding:12px 0 32px;font-size:11px;color:#c7c7cc">
    竞技游戏趋势看板 · 低保真原型 · 点击卡片看详情
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- DETAIL DRAWER -->
<div class="drawer" id="drawer">
  <div class="d-header">
    <div class="t">
      <div class="title" id="dTitle">—</div>
      <div class="meta" id="dMeta">
        <span id="dGame">—</span>
        <span id="dSource">—</span>
        <span id="dType">—</span>
      </div>
    </div>
    <div style="text-align:right">
      <div class="score" id="dScore">—</div>
      <div class="sl" id="dScoreLabel">势能</div>
    </div>
    <button class="d-close" id="dClose">✕</button>
  </div>

  <div class="d-section">
    <h4>数据概览</h4>
    <div class="data-row" id="dStats">
      <div class="data-item"><div class="v" id="dStat1v">—</div><div class="lbl" id="dStat1l">—</div></div>
      <div class="data-item"><div class="v" id="dStat2v">—</div><div class="lbl" id="dStat2l">—</div></div>
      <div class="data-item"><div class="v" id="dStat3v">—</div><div class="lbl" id="dStat3l">—</div></div>
    </div>
  </div>

  <div class="d-section" id="dNotesSection">
    <h4>样本笔记</h4>
    <div class="note-list" id="dNotes"></div>
  </div>

  <div class="d-section">
    <h4>AI 切入建议</h4>
    <div class="ai-card" id="dAiCard">
      <div class="lbl">方向建议</div>
      <div id="dAiText">—</div>
      <div class="row">
        <span class="ai-tag" id="dDifficulty">—</span>
        <span class="ai-tag" id="dAcceptType">—</span>
      </div>
    </div>
  </div>
</div>

<!-- GAME SUBSCRIPTION MODAL -->
<div class="modal" id="subModal">
  <div class="modal-bg" id="subBg"></div>
  <div class="modal-card">
    <h3>管理关注游戏</h3>
    <input class="modal-search" id="subSearch" placeholder="搜索游戏…">
    <div class="game-list" id="subGames"></div>
    <div class="modal-footer">
      <div class="count">已关注 <strong id="subChecked">14</strong>/14 款</div>
      <div class="mod-actions">
        <button class="mod-btn sec" id="subSelectAll">全选</button>
        <button class="mod-btn sec" id="subClear">清除</button>
        <button class="mod-btn pri" id="subSave">保存配置</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============ MOCK DATA ============
const GAMES = ['王者荣耀','和平精英','三角洲行动','金铲铲之战','英雄联盟','无畏契约','火影忍者','PUBG','暗区突围','永劫无间','CSGO','穿越火线：枪战王者','DOTA2','王者万象棋']

const TYPES = ['创作型','讨论型','双重']
const SOURCES_TREND = ['站外热','站内苗头','双重信号']
const SOURCES_HOT = ['全网热点','社区热点']
const LIFECYCLES = ['上升期','高峰期','衰退期']

function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rn(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function makeTrend(i){
  const gt=rand(GAMES)
  return {
    id:'tr-'+i,title:[
      '一句台词玩梗挑战','角色cos初音未来','打野梯度排行','游戏BGM卡点挑战',
      '新赛季英雄调整','极限操作集锦','游戏CG混剪','队友的神操作',
      '游戏内彩蛋发现','版本更新预测','逆风翻盘教学','角色台词模仿挑战'
    ][i%12],
    game:gt,momentum:rn(60,95),growth:rn(80,450),
    notes6h:rn(60,280),trendType:rand(TYPES),
    source:rand(SOURCES_TREND),subType:'蓝海选题',
    internalNotes:[],externalNotes:[],
    aiSuggestion:'适合创作：用游戏角色BGM配经典台词做二创，参考复刻方向为短视频。',
    difficulty:'中',acceptType:'短视频'
  }
}
function makeHot(i){
  const gt=rand(GAMES)
  const lc=rand(LIFECYCLES)
  return {
    id:'ht-'+i,title:[
      '角色cos日常穿搭挑战','和平精英变装挑战','金铲铲阵容攻略合集',
      '英雄联盟赛事观赛团','无畏契约对枪技巧','王者荣耀赛季回顾',
      '游戏角色仿妆挑战','电竞战队应援创作','PUBG搞笑集锦','三角洲特种兵攻略'
    ][i%10],
    game:gt,heatScore:rn(60,95),notesTotal:rn(1500,8000),
    ces:rn(20,90),last24h:rn(200,1200),
    lifecycle:lc,trendType:rand(TYPES),
    source:rand(SOURCES_HOT),
    internalNotes:[],externalNotes:[],
    aiSuggestion:'持续增长中，建议加大通告投入，创作者可产出图文+短视频。',
    difficulty:'中',acceptType:'通告'
  }
}

// Generate data
const trends=Array.from({length:12},(_,i)=>makeTrend(i))
const hots=Array.from({length:8},(_,i)=>makeHot(i))

// ============ STATE ============
let currentTab='trend'
let selectedItem=null
let subscribed=GAMES.map(g=>g) // all subscribed by default
let filterGame='all', filterType='all'

// ============ RENDER ============
function renderTrends(){
  const grid=document.getElementById('trendGrid')
  let items=trends.filter(t=>{
    if(filterGame!=='all' && t.game!==filterGame) return false
    if(filterType!=='all' && t.trendType!==filterType) return false
    if(!subscribed.includes(t.game)) return false
    return true
  })
  document.getElementById('trendHelp').textContent=`${items.length} 条`

  if(!items.length){
    grid.innerHTML='<div class="empty"><div class="icon">📡</div>暂无匹配的实时趋势<br>6h后自动刷新</div>'
    return
  }

  grid.innerHTML=items.map(t=>`
    <div class="t-card" data-id="${t.id}" data-type="trend">
      <div class="t">
        <div class="title">${t.title}</div>
        <div><div class="score">${t.momentum}</div><div class="slabel">势能</div></div>
      </div>
      <div class="body">
        <span class="tag ${t.source==='站外热'?'ext':t.source==='站内苗头'?'int':'dual'}">${t.source}</span>
        <span class="game">${t.game}</span>
        <span class="grow">↑${t.growth}%</span>
        <span class="type">${t.trendType}</span>
      </div>
      <div class="bot">
        <button class="b-btn pri view-btn" data-id="${t.id}">查看详情</button>
      </div>
    </div>
  `).join('')
  attachCardListeners('trend')
}

function renderHots(){
  const grid=document.getElementById('hotGrid')
  let items=hots.filter(h=>{
    if(filterGame!=='all' && h.game!==filterGame) return false
    if(filterType!=='all' && h.trendType!==filterType) return false
    if(!subscribed.includes(h.game)) return false
    return true
  })
  document.getElementById('hotHelp').textContent=`${items.length} 条`

  if(!items.length){
    grid.innerHTML='<div class="empty"><div class="icon">🔥</div>暂无匹配的热点<br>6h后自动刷新</div>'
    return
  }

  grid.innerHTML=items.map(h=>`
    <div class="h-card" data-id="${h.id}" data-type="hot">
      <div class="h-bar"><div class="h-fill" style="width:${h.heatScore}%"></div></div>
      <div class="t">
        <div class="title">${h.title}</div>
        <div><div class="score">${h.heatScore}</div><div class="sl">热度</div></div>
      </div>
      <div class="body" style="margin-bottom:4px">
        <span class="tag ${h.source==='全网热点'?'glbl':'comm'}">${h.source}</span>
      </div>
      <div class="h-body">
        <span class="game">${h.game}</span>
        <span class="h-stat">发布 <strong>${h.notesTotal>=1000?(h.notesTotal/1000).toFixed(1)+'k':h.notesTotal}</strong></span>
        <span class="h-stat">CES <strong>${h.ces}w</strong></span>
        <span class="life ${h.lifecycle==='上升期'?'up':h.lifecycle==='高峰期'?'peak':'decline'}">
          ${h.lifecycle==='上升期'?'📈':h.lifecycle==='高峰期'?'🔝':'📉'} ${h.lifecycle}
        </span>
      </div>
      <div class="bot">
        <button class="b-btn pri view-btn" data-id="${h.id}">查看详情</button>
      </div>
    </div>
  `).join('')
  attachCardListeners('hot')
}

function attachCardListeners(type){
  document.querySelectorAll(`.${type==='trend'?'t-card':'h-card'} .view-btn`).forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation()
      const id=btn.dataset.id
      const pool=type==='trend'?trends:hots
      const item=pool.find(x=>x.id===id)
      if(item) openDrawer(item,type)
    })
  })
  document.querySelectorAll(`.${type==='trend'?'t-card':'h-card'}`).forEach(card=>{
    card.addEventListener('click',function(e){
      if(e.target.closest('.b-btn')) return
      const id=this.dataset.id
      const pool=type==='trend'?trends:hots
      const item=pool.find(x=>x.id===id)
      if(item) openDrawer(item,type)
    })
  })
}

function updateStats(){
  const allTrends=trends.filter(t=>subscribed.includes(t.game))
  const allHots=hots.filter(h=>subscribed.includes(h.game))
  const blue=allTrends.filter(t=>t.source==='站外热'||t.source==='双重信号')
  const intr=allTrends.filter(t=>t.source==='站内苗头')
  document.getElementById('statTrendTotal').textContent=allTrends.length
  document.getElementById('statBlue').textContent=blue.length
  document.getElementById('statInternal').textContent=intr.length
  document.getElementById('statHot').textContent=allHots.length
  document.getElementById('subCount').textContent=subscribed.length
}

// ============ DETAIL DRAWER ============
function openDrawer(item,type){
  selectedItem=item
  const isTrend=type==='trend'
  document.getElementById('dTitle').textContent=item.title
  document.getElementById('dGame').textContent=item.game
  document.getElementById('dSource').textContent=item.source
  document.getElementById('dType').textContent=item.trendType

  const scoreEl=document.getElementById('dScore')
  scoreEl.className='score '+(isTrend?'orange':'pink')
  scoreEl.textContent=isTrend?item.momentum:item.heatScore
  document.getElementById('dScoreLabel').textContent=isTrend?'势能':'热度'

  document.getElementById('dMeta').style.display='flex'

  if(isTrend){
    document.getElementById('dStat1l').textContent='近6h增速'
    document.getElementById('dStat1v').textContent='↑'+item.growth+'%'
    document.getElementById('dStat2l').textContent='近6h笔记'
    document.getElementById('dStat2v').textContent=item.notes6h
    document.getElementById('dStat3l').textContent='子类型'
    document.getElementById('dStat3v').textContent=item.source
  } else {
    document.getElementById('dStat1l').textContent='累计发布'
    document.getElementById('dStat1v').textContent=item.notesTotal>=1000?(item.notesTotal/1000).toFixed(1)+'k':item.notesTotal
    document.getElementById('dStat2l').textContent='CES'
    document.getElementById('dStat2v').textContent=item.ces+'w'
    document.getElementById('dStat3l').textContent='生命周期'
    document.getElementById('dStat3v').textContent=item.lifecycle
  }

  // Notes
  const notesEl=document.getElementById('dNotes')
  const sampleNotes=[
    {title:item.title+' - 站内热门',sub:'❤️ 12.3k 小红书',url:'#',icon:isTrend?'📱':'📱'},
    {title:item.title+' - 抖音爆款',sub:'❤️ 8.9k 抖音',url:'#',icon:'🎬'},
    {title:item.title+' - B站热门',sub:'❤️ 5.6k B站',url:'#',icon:'▶️'},
  ]
  notesEl.innerHTML=sampleNotes.map(n=>`
    <div class="note-item" onclick="alert('跳转: ${n.title}')">
      <div class="icon">${n.icon}</div>
      <div class="info">
        <div class="t">${n.title}</div>
        <div class="sub">${n.sub}</div>
      </div>
      <span class="link">打开→</span>
    </div>
  `).join('')

  document.getElementById('dAiText').textContent=item.aiSuggestion
  document.getElementById('dDifficulty').textContent='复刻 · '+item.difficulty
  document.getElementById('dAcceptType').textContent='承接 · '+item.acceptType

  document.getElementById('drawer').classList.add('open')
  document.getElementById('overlay').classList.add('show')
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
}
document.getElementById('dClose').addEventListener('click',closeDrawer)
document.getElementById('overlay').addEventListener('click',closeDrawer)

// ============ TAB SWITCH ============
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
    this.classList.add('active')
    currentTab=this.dataset.tab
    document.getElementById('trendSection').style.display=currentTab==='trend'?'block':'none'
    document.getElementById('hotSection').style.display=currentTab==='hot'?'block':'none'
  })
})

// ============ FILTERS ============
document.querySelectorAll('.f-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    const filter=this.dataset.filter
    if(filter.startsWith('game-')){
      document.querySelectorAll('[data-filter^="game-"]').forEach(b=>b.classList.remove('active'))
      this.classList.add('active')
      filterGame=filter.replace('game-','')
    } else if(filter.startsWith('type-')){
      document.querySelectorAll('[data-filter^="type-"]').forEach(b=>b.classList.remove('active'))
      this.classList.add('active')
      filterType=filter.replace('type-','')
    }
    renderTrends()
    renderHots()
    updateStats()
  })
})

// ============ GAME SUBSCRIPTION ============
function openSubModal(){
  const list=document.getElementById('subGames')
  const q=document.getElementById('subSearch').value.toLowerCase()
  const filtered=GAMES.filter(g=>g.toLowerCase().includes(q))
  list.innerHTML=filtered.map(g=>{
    const checked=subscribed.includes(g)?'checked':''
    return `<label class="game-item"><input type="checkbox" value="${g}" ${checked}>${g}</label>`
  }).join('')
  updateSubCount()
  document.getElementById('subModal').classList.add('show')
}
document.getElementById('subBtn').addEventListener('click',openSubModal)
document.getElementById('subBg').addEventListener('click',()=>document.getElementById('subModal').classList.remove('show'))

document.getElementById('subSearch').addEventListener('input',function(){
  const list=document.getElementById('subGames')
  const q=this.value.toLowerCase()
  const filtered=GAMES.filter(g=>g.toLowerCase().includes(q))
  list.innerHTML=filtered.map(g=>{
    const checked=subscribed.includes(g)?'checked':''
    return `<label class="game-item"><input type="checkbox" value="${g}" ${checked}>${g}</label>`
  }).join('')
  updateSubCount()
})

function updateSubCount(){
  const checks=document.querySelectorAll('#subGames input[type=checkbox]')
  const checked=document.querySelectorAll('#subGames input[type=checkbox]:checked').length
  document.getElementById('subChecked').textContent=checked
}
function getCheckedGames(){
  const checks=document.querySelectorAll('#subGames input[type=checkbox]:checked')
  return Array.from(checks).map(c=>c.value)
}

document.getElementById('subSelectAll').addEventListener('click',()=>{
  document.querySelectorAll('#subGames input[type=checkbox]').forEach(c=>c.checked=true)
  updateSubCount()
})
document.getElementById('subClear').addEventListener('click',()=>{
  document.querySelectorAll('#subGames input[type=checkbox]').forEach(c=>c.checked=false)
  updateSubCount()
})
document.getElementById('subSave').addEventListener('click',()=>{
  subscribed=getCheckedGames()
  // Save to localStorage
  localStorage.setItem('subscribed_games',JSON.stringify(subscribed))
  document.getElementById('subModal').classList.remove('show')
  renderTrends()
  renderHots()
  updateStats()
  showToast('游戏关注配置已保存')
})

// ============ TOAST ============
function showToast(msg){
  const t=document.getElementById('toast')
  t.textContent=msg
  t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),2000)
}

// ============ INIT ============
// Load subscription from localStorage
try{
  const saved=localStorage.getItem('subscribed_games')
  if(saved) subscribed=JSON.parse(saved)
}catch(e){}

renderTrends()
renderHots()
updateStats()

// Update timestamp
const now=new Date()
document.getElementById('updateTime').textContent=`更新于 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`
</script>
